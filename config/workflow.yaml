# Workflow definitions
# Multi-task automation chains.  Run with:
#   python agent.py --workflow <name>

# ── Daily download cleanup ────────────────────────────────────────────────────
daily_cleanup:
  description: "Organise Downloads folder by file type and remove old junk"
  tasks:
    - task: organize_downloads
      args:
        create_subfolders:
          Images:    ["jpg", "jpeg", "png", "gif", "webp", "bmp"]
          Documents: ["pdf", "doc", "docx", "txt", "rtf", "odt"]
          Archives:  ["zip", "tar", "gz", "7z", "rar"]
          Code:      ["py", "js", "ts", "sh", "yaml", "json", "toml"]
        move_videos: true
        delete_junk: true
        junk_patterns: ["*.tmp", "*.crdownload", "*.part"]
        delete_older_than_days: 30
      retries: 1
  on_error: "notify"

# ── Evening browser session ───────────────────────────────────────────────────
browser_evening:
  description: "Visit a set of bookmarks and take screenshots"
  timeout: 120
  tasks:
    - task: open_browser_and_visit
      args:
        url: "https://news.ycombinator.com"
        screenshot: true
    - task: wait_seconds
      args:
        seconds: 3
    - task: open_browser_and_visit
      args:
        url: "https://github.com"
        screenshot: true
  on_error: "notify"

# ── Batch file organisation ───────────────────────────────────────────────────
batch_process:
  description: "Organise downloads and move videos"
  tasks:
    - task: organize_downloads
      args:
        create_subfolders:
          Images:    ["jpg", "png", "gif", "webp"]
          Documents: ["pdf", "doc", "docx", "txt"]
          Archives:  ["zip", "tar", "gz"]
        move_videos: true
        delete_junk: true
        junk_patterns: ["*.tmp", "*.crdownload"]
      retries: 2
  on_error: "notify"

# ── Install a set of apps ─────────────────────────────────────────────────────
install_essentials:
  description: "Install VLC, GIMP, and Inkscape"
  tasks:
    - task: install_app
      args:
        app_name: "VLC"
    - task: install_app
      args:
        app_name: "GIMP"
    - task: install_app
      args:
        app_name: "Inkscape"
  on_error: "notify"

# ── Window layout ─────────────────────────────────────────────────────────────
tile_windows:
  description: "Tile the top-4 open windows in a 2x2 grid"
  tasks:
    - task: window_management
      args:
        operation: "maximize"
        window: "Firefox"
    - task: wait_seconds
      args:
        seconds: 1
  on_error: "ignore"

# ── Advanced test: ubuntu_agent_test project ────────────────────────────────────
ubuntu_agent_test:
  description: "Full project setup, system report, backup, checksum, verification"
  on_error: "abort"
  tasks:
    - task: run_command
      args:
        command: "mkdir -p ~/ubuntu_agent_test/{src,backup,logs,output}"

    - task: run_command
      args:
        command: |
          cat > ~/ubuntu_agent_test/src/system_report.py << 'EOF'
          import socket, platform, psutil, datetime, subprocess, os
          hostname = socket.gethostname()
          kernel = platform.release()
          cpu = platform.processor() or "unknown"
          ram = f"{psutil.virtual_memory().total // (1024**3)} GB"
          disk = subprocess.getoutput("df -h / | awk 'NR==2 {print $3\"/\"$2}'")
          now = datetime.datetime.now().isoformat()
          out_path = os.path.expanduser("~/ubuntu_agent_test/output/system_report.txt")
          with open(out_path, "w") as f:
              f.write(f"Hostname: {hostname}\nKernel: {kernel}\nCPU: {cpu}\nRAM: {ram}\nDisk: {disk}\nDate: {now}\n")
          print(f"Report saved to {out_path}")
          EOF

    - task: run_command
      args:
        command: "cd ~/ubuntu_agent_test && python3 src/system_report.py"

    - task: run_command
      args:
        command: "test -f ~/ubuntu_agent_test/output/system_report.txt && echo 'REPORT VERIFIED' || echo 'REPORT MISSING'"

    - task: run_command
      args:
        command: "tar -czf ~/ubuntu_agent_test/backup/project_backup.tar.gz -C ~/ubuntu_agent_test ."

    - task: run_command
      args:
        command: "sha256sum ~/ubuntu_agent_test/backup/project_backup.tar.gz | cut -d' ' -f1 > ~/ubuntu_agent_test/logs/checksum.txt"

    - task: run_command
      args:
        command: "cat ~/ubuntu_agent_test/logs/checksum.txt"

    - task: run_command
      args:
        command: |
          mkdir -p /tmp/verify_extract &&
          tar -xzf ~/ubuntu_agent_test/backup/project_backup.tar.gz -C /tmp/verify_extract &&
          echo "EXTRACTED FILES:" &&
          find /tmp/verify_extract -type f | sort &&
          echo "VERIFICATION: All files present"

    - task: run_command
      args:
        command: "echo '=== SUCCESS SUMMARY ===' && echo 'Project: ~/ubuntu_agent_test' && echo 'Report: output/system_report.txt' && echo 'Backup: backup/project_backup.tar.gz' && echo 'Checksum: logs/checksum.txt' && echo 'All steps completed successfully!'"
  on_error: "abort"